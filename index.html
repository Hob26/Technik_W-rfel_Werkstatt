<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Technik – Würfel-Werkstatt (iPad)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@300;400;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#3a2414; --head:#612d0c; --card:#FFFBEF; --yel1:#F4BF50; --yel2:#F7D36D; --pill:#6d5646; --pilltxt:#fff;
  --acc:#B8601E; --scrib:#644c3a; --ok:#3F8F5E; --bad:#D4573B; --frame:#ffffff; --line:rgba(97,45,12,.24); --shadow:rgba(97,45,12,.12);
  --hl:rgba(244,191,80,.45); --bw:min(100vw,1400px);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px;line-height:1.45;min-height:100vh;position:relative;overflow-x:hidden}
.brush{font-family:'Londrina Solid','Luckiest Guy','Impact',sans-serif;font-weight:400;letter-spacing:.8px;line-height:1.05;margin:0;text-transform:uppercase}
button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
#band{position:absolute;left:0;right:0;top:0;pointer-events:none;z-index:0}
#band svg{display:block}
.scrib{position:absolute;right:6px;top:52px;pointer-events:none}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px;position:relative;z-index:1}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding:10px 12px;transition:background .2s}
.top.solid{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 0 var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.home{border:0;background:var(--pill);color:var(--pilltxt);border-radius:999px;width:42px;height:42px;font-size:20px;font-weight:800;cursor:pointer;flex:none;display:grid;place-items:center}
.home[hidden]{display:none}
.steps{display:flex;gap:6px;flex:1;justify-content:center}
.dot{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);background:var(--bg);font:800 16px 'Outfit',sans-serif;color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.dot:active{transform:scale(.92)}
.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.qz{border-color:var(--acc);color:var(--acc)}
.dot.qz.done{color:#fff}
.dot.cur{box-shadow:0 0 0 4px var(--hl)}
.dot.lock{opacity:.55}
.dot.star.ready{background:var(--yel1);border-color:var(--yel1);color:#4a2209}

/* ---------- generic ---------- */
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 5px 0 var(--shadow);margin:16px 0;position:relative;border:2px solid color-mix(in srgb,var(--yel1) 35%,transparent)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:13px 22px;font:800 17px 'Outfit',sans-serif;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.alt{background:var(--yel1);color:#4a2209}
.btn.sm{padding:8px 14px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:default}
a.btn{display:inline-block;text-decoration:none}
.pill{display:inline-block;background:var(--pill);color:var(--pilltxt);padding:8px 30px;font-size:21px;font-weight:700;clip-path:polygon(0 24%,2% 4%,8% 10%,50% 0,92% 8%,98% 2%,100% 34%,97% 60%,100% 90%,94% 100%,50% 94%,6% 100%,0 76%,3% 52%)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:2.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:800 15.5px 'Outfit',sans-serif;cursor:pointer;transition:transform .12s}
.chip:active{transform:scale(.95)}
.chip.bad{opacity:.5;text-decoration:line-through;border-color:var(--bad);color:var(--bad);pointer-events:none}
.imgbox{background:var(--frame);border-radius:16px;display:grid;place-items:center;padding:8px;overflow:hidden}
.imgbox img{max-width:100%;display:block;object-fit:contain;pointer-events:none}
.q{margin:0 0 6px;font-weight:800;font-size:18px}
.sec{font-family:'Londrina Solid','Luckiest Guy','Impact',sans-serif;text-transform:uppercase;font-size:26px;letter-spacing:.8px;margin:0 0 6px;display:flex;align-items:center;gap:10px}
.sec .ab{flex:none;width:34px;height:34px;border-radius:50%;background:var(--yel1);color:#4a2209;display:grid;place-items:center;font-size:19px}
.hint{font-size:14.5px;font-weight:600;opacity:.8;margin:0 0 8px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-weight:800;font-size:16px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{background:var(--ok);color:#fff}
#toast.bad{background:var(--bad);color:#fff}
.okmsg{font-weight:800;color:var(--ok)}
.mcq{padding:10px 0;border-top:2px dotted var(--line)}
.mcq:first-of-type{border-top:0}
.mcq.solved .q::after{content:" ✓";color:var(--ok)}

/* ---------- drag & drop ---------- */
.dg{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;-webkit-touch-callout:none}
.dg.lifted{opacity:.25}
.dg.picked{outline:4px solid var(--yel1);outline-offset:2px}
.dg.locked{cursor:default;touch-action:auto}
.ghost{position:fixed;z-index:200;pointer-events:none;margin:0!important;transform:rotate(3deg) scale(1.06);box-shadow:0 12px 24px rgba(0,0,0,.28);opacity:.95}
.dz{transition:background .15s,border-color .15s}
.dz.hover{background:var(--hl)!important;border-color:var(--yel1)!important}
.tray{display:flex;flex-wrap:wrap;gap:10px;padding:12px;border-radius:18px;background:color-mix(in srgb,var(--yel2) 35%,transparent);border:2.5px dashed var(--line);min-height:62px;align-items:center;justify-content:center}
.tray:empty::after{content:"✓ alles verteilt";font-weight:800;color:var(--ok)}
.pic{width:96px;height:96px;background:var(--frame);border-radius:14px;display:grid;place-items:center;padding:4px;box-shadow:0 3px 0 var(--shadow)}
.pic img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.tchip{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:14px;font-weight:800;font-size:15.5px;box-shadow:0 3px 0 var(--shadow)}
.tcard{background:var(--frame);color:#4a2209;padding:9px 12px;border-radius:14px;font-weight:700;font-size:15px;box-shadow:0 3px 0 var(--shadow);border:2px solid var(--line);max-width:100%}
.slot{border:3px dashed var(--line);border-radius:16px;min-height:62px;display:grid;place-items:center;text-align:center;font-weight:700;font-size:14px;opacity:1;background:color-mix(in srgb,var(--bg) 70%,transparent);padding:4px}
.slot:empty::after{content:"hier ablegen";opacity:.5;font-size:13px}
.slot.full{border-style:solid;border-color:var(--ok)}

/* ---------- hub ---------- */
.hubtop{position:relative;height:240px}
.hubtop .tl{position:absolute;left:-6px;top:44px;transform:rotate(-6deg)}
.hubtop .tr{position:absolute;right:-4px;top:30px;transform:rotate(14deg)}
.hubhead{text-align:center;margin-top:-6px}
.hubhead .brush{font-size:clamp(66px,20vw,108px);color:var(--ink)}
.hubhead .pill{margin:2px 0 6px}
.hubhead h2.brush{font-size:clamp(26px,7.4vw,40px);color:var(--acc);margin-top:6px;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.hubhead p{margin:10px auto 0;max-width:30em;font-weight:700}
.who{display:grid;grid-template-columns:1fr 110px;gap:10px}
.who label{display:block;font-weight:800;font-size:14px;margin-bottom:4px;color:var(--acc)}
.who input{width:100%;font:700 17px 'Outfit',sans-serif;color:var(--ink);background:var(--bg);border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;outline:none}
.who input:focus{box-shadow:0 0 0 4px var(--hl)}
.tiles{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.tiles>*{min-width:0;max-width:100%}
.tile{width:100%;display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid color-mix(in srgb,var(--yel1) 35%,transparent);border-radius:22px;padding:14px;box-shadow:0 5px 0 var(--shadow);cursor:pointer;transition:transform .15s}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.tile .num{flex:none;width:54px;height:54px;border-radius:50%;background:var(--yel1);color:#4a2209;display:grid;place-items:center;font-size:30px}
.tile.done .num{background:var(--ok);color:#fff}
.tile>span:last-child{min-width:0}
.tile b{display:block;font-size:18.5px;overflow-wrap:anywhere;hyphens:auto}
.tile span.sub{font-size:14.5px;opacity:.85;font-weight:600}
.tile.alt .num{background:var(--pill);color:#fff;font-size:26px}
.tile.lock{opacity:.65}
.tile.final{grid-column:1/-1;background:var(--ink);color:var(--bg)}
.hubbottom{position:relative;height:220px;margin-top:26px;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);overflow:hidden}
.hubbottom .bl{position:absolute;left:max(10px,calc(50% - 360px));bottom:-14px;transform:rotate(14deg)}
.hubbottom .br{position:absolute;right:max(10px,calc(50% - 360px));bottom:-10px;transform:rotate(-8deg)}
.reset{white-space:nowrap;background:none;border:0;text-decoration:underline;font-weight:700;opacity:.75;cursor:pointer;font-size:14px;color:var(--ink);position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:color-mix(in srgb,var(--bg) 70%,transparent);border-radius:999px;padding:4px 12px}

/* ---------- station intro ---------- */
.stationtop{height:70px}
.intro{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:6px 2px 0}
.intro-l{min-width:0;flex:1}
.intro-r{flex:none;margin-top:6px}
.badge{display:inline-block;background:var(--pill);color:var(--pilltxt);padding:3px 18px;font-weight:800;font-size:15px;letter-spacing:.4px;clip-path:polygon(0 20%,3% 0,50% 8%,97% 0,100% 40%,98% 100%,50% 92%,3% 100%)}
.intro h2{font-size:clamp(38px,11vw,62px);margin:8px 0 10px;overflow-wrap:anywhere;hyphens:auto}
.tasks{margin:0;padding-left:20px;display:grid;gap:5px;font-weight:700;font-size:16.5px}
.tasks li::marker{color:var(--acc)}
.finish{background:var(--ok);color:#fff;text-align:center;border-color:transparent}
.finish .brush{font-size:40px}
.finish .btn{background:#fff;color:#4a2209;margin-top:10px}

/* ---------- station 1 ---------- */
.dscard{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:2px dotted var(--line)}
.dscard:first-of-type{border-top:0}
.dscard .slot{flex:none;width:106px;height:106px}
.dscard .slot .pic{width:96px;height:96px;box-shadow:none}
.dscard b{color:var(--acc);display:block}
.dscard div:last-child{font-weight:600;font-size:15.5px}
.skgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sk canvas{width:100%;height:150px;background:var(--frame);border-radius:14px;touch-action:none;display:block;border:2px dashed var(--line)}
.sk b{display:block;margin-bottom:3px;font-size:15px}
.sk .btn{margin-top:5px}

/* ---------- station 2 ---------- */
.pressrow{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;align-items:end}
.fig{position:relative}
.fig .imgbox{padding:6px}
.fig img{width:100%}
.mk{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:2.5px solid #fff;background:var(--ink);color:var(--bg);font:800 15px 'Outfit',sans-serif;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4);padding:0}
.mk::after{content:"";position:absolute;inset:-12px;border-radius:50%}
.mk.dz.hover{transform:translate(-50%,-50%) scale(1.5);background:var(--yel1)!important;color:#4a2209}
.mk.ok{background:var(--ok);color:#fff;pointer-events:none}
.bitline{position:absolute;left:31.2%;top:41.6%;width:3px;height:6.4%;background:linear-gradient(90deg,#8d97a6,#e6eaf0,#8d97a6);border-radius:0 0 2px 2px;pointer-events:none}
.found{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.found li{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:15.5px}
.found .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.frow{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:6px 0}
.frow .n{width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.frow .rt{min-width:0}
.frow b{display:block}
.frow .slot{min-height:46px;margin-top:4px;text-align:left;justify-items:stretch}
.frow .slot .tcard{box-shadow:none;border-color:var(--ok)}
.special{border:3px dashed var(--yel1);background:transparent;box-shadow:none}
.special label{display:flex;gap:10px;align-items:center;font-weight:700;margin-top:8px;cursor:pointer}
.special input{width:22px;height:22px;accent-color:var(--ok)}

/* ---------- station 3 ---------- */
.shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.shape{border:2.5px solid var(--ink);background:var(--frame);color:#4a2209;border-radius:18px;padding:6px 4px 8px;cursor:pointer;font-weight:800;font-size:13px;text-align:center}
.shape svg{width:100%;height:auto;display:block}
.shape.bad{opacity:.4;border-color:var(--bad)}
.shape.ok{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok)}
.mats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.mat .slot{min-height:64px}
.mat b{display:block;text-align:center;margin-bottom:4px;font-size:16px}
.mat .tchip{font-size:14px;padding:7px 8px}
.tools2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tools2 .slot{min-height:70px}
.tools2 .cap{font-weight:800;text-align:center;margin-bottom:4px}
.gap-sent{margin:10px 0;font-weight:700;line-height:2.1}
.gap{display:inline-block;min-width:104px;min-height:36px;vertical-align:middle;border:2.5px dashed var(--ink);border-radius:12px;text-align:center;padding:0 6px;line-height:32px;margin:0 3px}
.gap.full{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.gap .tchip{display:inline-block;box-shadow:none;padding:2px 10px;background:var(--ok);color:#fff}

/* ---------- station 4 ---------- */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.rbox{background:var(--bg);border-radius:18px;padding:8px;border:2px solid var(--line)}
.rbox .imgbox{padding:4px}
.rbox .slot{margin-top:6px;min-height:78px;font-size:14px}
.rbox .slot .tcard{box-shadow:none;border-color:var(--ok);font-size:13.5px}
.tf{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:2px dotted var(--line);flex-wrap:wrap}
.tf:first-of-type{border-top:0}
.tf .st{font-weight:700;flex:1 1 220px}
.tf .btns{display:flex;gap:8px}
.tf.solved .st::after{content:" ✓";color:var(--ok)}
.tf .btn.sm.bad{opacity:.4}

/* ---------- station 5 ---------- */
.video{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.video .play{flex:none;width:64px;height:64px;border-radius:50%;background:var(--yel1);display:grid;place-items:center;font-size:28px;color:#4a2209}
.video .vt{flex:1 1 200px;min-width:0}
.video small{display:block;font-weight:600;opacity:.8}
.steps5{display:grid;gap:7px;margin-top:12px}
.s5row{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center}
.s5row .pos{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px}
.s5row .slot{min-height:46px;text-align:left;justify-items:stretch}
.s5row .slot .tcard{box-shadow:none}
.s5row.ok .slot{border-color:var(--ok);border-style:solid}
.s5row.no .slot{border-color:var(--bad);border-style:solid}
.msg{font-weight:800;margin:12px 0 0}

/* ---------- checklist ---------- */
.chk{display:grid;grid-template-columns:1fr 120px;gap:14px}
@media(max-width:480px){.chk{grid-template-columns:1fr}.chk .imgbox{max-width:160px;margin:0 auto}}
.chk ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.chk li label{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;background:var(--bg);border-radius:14px;padding:8px 10px}
.chk li .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--yel1);color:#4a2209;display:grid;place-items:center;font-weight:800;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--ok);margin-left:auto}
.tipps{background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 16px;margin-top:12px;font-weight:700}
.tipps b{color:var(--yel2)}

/* ---------- certificate ---------- */
.cert{border-radius:26px;overflow:hidden;background:var(--card);box-shadow:0 6px 0 var(--shadow);margin:16px 0;position:relative;border:4px solid var(--ink)}
.cert-head{background:var(--ink);color:var(--bg);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cert-head .brush{font-size:clamp(22px,6.4vw,34px);min-width:0;hyphens:auto;overflow-wrap:break-word}
.stars{letter-spacing:3px;color:var(--yel1);font-size:16px}
.cert-body{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:18px;position:relative}
.cert-body>div{min-width:0;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
@media(max-width:440px){.cert-body{grid-template-columns:84px minmax(0,1fr);gap:12px;padding:14px}}
.photo{background:var(--frame);border-radius:12px;padding:4px;align-self:start;border:2px solid var(--line)}
.photo img{width:100%;display:block}
.cert .nm{font-size:clamp(28px,8.5vw,46px);color:var(--acc);border-bottom:3px solid var(--ink);padding-bottom:2px}
.cert .meta{display:flex;gap:18px;flex-wrap:wrap;font-weight:800;margin:8px 0}
.cert .meta span{opacity:.75;font-size:13px;display:block}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:0 18px 18px}
.sig div{border-top:2px solid var(--ink);padding-top:3px;font-size:13px;font-weight:800}
.stamp{display:inline-block;margin-top:12px;border:4px solid var(--bad);color:var(--bad);border-radius:12px;padding:2px 12px;font-size:26px;transform:rotate(-6deg);opacity:.9;pointer-events:none}
.cf{position:fixed;top:-16px;width:9px;height:14px;border-radius:2px;z-index:70;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}.shake,.pop{animation:none}}

/* ---------- Dropdown-Sortierung & Quiz ---------- */
.s5row select{width:100%;font:700 16px 'Outfit',sans-serif;color:var(--ink);background:var(--bg);border:2.5px solid var(--ink);border-radius:14px;padding:11px 10px;outline:none;min-height:46px}
.s5row select:focus{box-shadow:0 0 0 4px var(--hl)}
.s5row.ok select{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg))}
.s5row.no select{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.qprog{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:8px}
.qprog>div{height:100%;background:var(--yel1);transition:width .3s}
.qopts{display:grid;gap:8px;margin-top:10px}
.qopts .opt{border:2.5px solid var(--ink);background:transparent;border-radius:16px;padding:11px 14px;text-align:left;font:800 16px 'Outfit',sans-serif;cursor:pointer;color:var(--ink)}
.qopts .opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.qopts .opt.wrongo{background:var(--bad);border-color:var(--bad);color:#fff}
.score{font-family:'Londrina Solid','Luckiest Guy','Impact',sans-serif;font-size:56px;line-height:1;text-align:center}
.review{margin:12px 0 0;padding-left:20px;font-weight:600;font-size:15.5px;display:grid;gap:8px}
.review b{color:var(--ok)}

/* ---------- iPad-Zusatzaufgaben ---------- */
body{font-size:18px}
.wrap,.top-in{max-width:900px}
.tile b{font-size:19px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mc{position:relative;aspect-ratio:1;border:0;border-radius:18px;padding:0;cursor:pointer;background:var(--pill);color:var(--pilltxt);font:400 40px 'Londrina Solid','Luckiest Guy','Impact',sans-serif;box-shadow:0 4px 0 var(--shadow);overflow:hidden}
.mc .back,.mc .front{position:absolute;inset:0;display:grid;place-items:center;padding:6px;text-align:center}
.mc .front{display:none;background:var(--frame);color:#4a2209;font:800 16px 'Outfit',sans-serif}
.mc .front img{max-width:88%;max-height:88%;object-fit:contain}
.mc.up .front,.mc.ok .front{display:grid}
.mc.up .back,.mc.ok .back{display:none}
.mc.ok{outline:4px solid var(--ok);outline-offset:-4px}
@media(max-width:520px){.mc .front{font-size:13px}}
.z2grid{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:720px){.z2grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.fields{display:grid;gap:8px}
.zf{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center}
.zf .n{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800}
.zf input{width:100%;font:700 18px 'Outfit',sans-serif;color:var(--ink);background:var(--bg);border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;outline:none}
.zf input:focus{box-shadow:0 0 0 4px var(--hl)}
.zf.ok input{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg))}
.zf.ok .n{background:var(--ok);color:#fff}
.zf.no input{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.board{width:100%;height:auto;display:block;touch-action:none;margin-top:12px;border-radius:14px;background:var(--frame);cursor:crosshair;user-select:none;-webkit-user-select:none}
.read{margin-top:8px;font-weight:700;min-height:28px}
.amps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.amp{border-radius:18px;padding:10px;border:3px solid var(--line)}
.amp.g{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.amp.r{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.amp b{display:block;text-align:center;margin-bottom:6px}
.abox{min-height:160px;display:flex;flex-direction:column;gap:8px;border-radius:12px}
.abox .tcard{font-size:14.5px}
.case{display:grid;grid-template-columns:34px 1fr;gap:6px 12px;align-items:center;padding:12px 0;border-top:2px dotted var(--line)}
.case:first-of-type{border-top:0}
.case .n{width:34px;height:34px;border-radius:50%;background:var(--yel1);color:#4a2209;display:grid;place-items:center;font-weight:800}
.case .ct{font-weight:700}
.case select{grid-column:2;width:100%;font:700 16px 'Outfit',sans-serif;color:var(--ink);background:var(--bg);border:2.5px solid var(--ink);border-radius:14px;padding:11px 10px;min-height:46px}
.case.ok select{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg))}
.case.ok .n{background:var(--ok);color:#fff}
.proof{background:#fff;color:#4a2209;border-radius:16px;padding:10px 12px;margin:10px 0;text-align:left;font-weight:700}
.fin-name{width:100%;font:800 18px 'Outfit',sans-serif;border:0;border-bottom:2px solid #4a2209;background:transparent;color:#4a2209;margin-bottom:6px;outline:none}

/* ---------- Canva-Technik-Stil (Aquarell, Braun, Londrina) ---------- */
body{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:18px;font-weight:400;color:var(--ink);background:#fff}
.brush,.sec,.score,.mc,.tile .num{font-family:'Londrina Solid','Luckiest Guy','Impact',sans-serif;font-weight:900;letter-spacing:.6px}
.brush{color:var(--head)}
.sec{color:var(--head);font-size:30px}
b,strong{font-weight:700}
.q,.chip,.opt,.tile b,.tcard,.tchip{font-family:'Outfit',sans-serif}
.btn{background:var(--pill);color:#fff;font-weight:600;border-radius:999px;padding:13px 24px}
.btn.alt{background:var(--yel1);color:var(--head)}
.pill{background:var(--pill);color:#fff;font-weight:500;font-size:22px;padding:8px 34px}
#band{display:flex;justify-content:center}
#band img{width:var(--bw);max-width:100%;height:auto;display:block}
.herospacer{height:calc(var(--bw)*.5627 - 52px)}
.stationtop{height:max(6px,calc(var(--bw)*.135 - 50px))}
.hubhead{text-align:center;margin-top:4px}
.hubhead h2.brush{font-size:clamp(32px,6.6vw,56px);color:var(--head);margin:6px 0 12px;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.hubhead p{margin:12px auto 0;max-width:30em;font-weight:500}
.intro{align-items:center}
.intro-l{min-width:0;flex:1}
.intro-r{flex:none;width:min(34%,230px)}
.intro-r img{width:100%;height:auto;display:block}
.intro h2{font-size:clamp(38px,8vw,80px);margin:10px 0 14px;color:var(--head);overflow-wrap:break-word;hyphens:auto}
.tasks{list-style:disc;padding-left:22px;gap:6px;font-weight:400;font-size:clamp(16px,2.4vw,21px);color:#2b1d14}
.tasks li::marker{color:#2b1d14}
.badge{font-weight:500;font-size:16px;padding:4px 20px}
.card{background:var(--card);border:2px solid color-mix(in srgb,var(--yel1) 55%,transparent);box-shadow:0 4px 0 color-mix(in srgb,var(--yel1) 45%,transparent)}
.tile .num{background:var(--yel1);color:var(--head);font-size:34px}
.tile.done .num{background:var(--ok);color:#fff}
.sec .ab{background:var(--yel1);color:var(--head);font-family:'Londrina Solid',sans-serif;font-weight:900;font-size:22px}
.foot{text-align:right;margin:26px -16px -48px 0;pointer-events:none;line-height:0}
.foot img{width:min(30vw,170px);display:inline-block}
.reset{position:static;transform:none;display:block;margin:22px auto 0;background:none;opacity:.8}
.top.solid{background:rgba(255,255,255,.94)}
.finish{background:var(--ok);border-color:transparent;box-shadow:none}
.finish .brush{color:#fff}
.finish .btn{background:#fff;color:var(--head)}

/* ---------- Würfel-Werkstatt ---------- */
.face{width:min(100%,420px);height:auto;display:block;margin:12px auto 0;touch-action:none;background:var(--frame);border-radius:14px;user-select:none;-webkit-user-select:none}
.iso{width:min(100%,520px);height:auto;display:block;margin:10px auto 0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.iso .edge{cursor:pointer}
.iso .edge .vis{stroke:#6d5646;stroke-width:2.6;stroke-linecap:round;fill:none}
.iso .edge .hit{stroke:transparent;stroke-width:22;stroke-linecap:round;fill:none;pointer-events:stroke}
.iso .edge.hid .vis{stroke-dasharray:6 5;opacity:.75}
.iso .edge.broken .vis{stroke:#F4BF50;stroke-width:8;stroke-dasharray:none;opacity:1}
.iso .rim .vis{stroke:#a98f7a;stroke-width:2.4}
.iso .rim.broken .vis{stroke:#F4BF50;stroke-width:6}
.counter{text-align:center;font-size:19px;margin-top:10px}
.sandwrap{position:relative;width:100%;height:230px;border-radius:14px;overflow:hidden;box-shadow:0 3px 0 var(--shadow)}
.sandwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.obs{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;margin-top:6px;background:var(--bg);border:2px solid var(--line)}
.obs .n{width:34px;height:34px;border-radius:50%;background:var(--yel1);color:var(--head);display:grid;place-items:center;font-weight:800}
.obs .t{font-weight:600}
.obs .bt{display:flex;gap:8px}
.obs .bt button{width:48px;height:44px;border-radius:12px;border:2.5px solid var(--ink);background:transparent;font-size:22px;font-weight:800;cursor:pointer;color:var(--ink)}
.obs .bt .yes.on{background:var(--ok);border-color:var(--ok);color:#fff}
.obs .bt .no.on{background:var(--bad);border-color:var(--bad);color:#fff}
.obs.okr{border-color:var(--ok)}
.obs.nor{border-color:var(--bad)}

/* ---------- Ergänzungen ---------- */
.notice{border-color:var(--yel1);background:#FFF3CF;font-weight:500}
.warn{display:flex;gap:12px;align-items:flex-start;background:#FFE6DF;border:3px solid var(--bad);border-radius:18px;padding:14px 16px;margin:16px 0;font-weight:500;color:#5a1b0c}
.warn .wi{font-size:32px;line-height:1}
.safe{display:flex;gap:12px;align-items:center;background:var(--bg);border:3px solid var(--bad);border-radius:14px;padding:12px 14px;font-weight:500;cursor:pointer}
.safe input{width:26px;height:26px;accent-color:var(--ok);flex:none}
.crit{margin:6px 0 0;padding-left:22px;display:grid;gap:6px}
.qcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.qc{background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:10px}
.qc .imgbox{padding:6px}
.qc .qn{font-family:'Londrina Solid',sans-serif;font-weight:900;font-size:24px;color:var(--head);margin:6px 0 0}
.qc.solved{border-color:var(--ok)}
.coderow{display:flex;gap:10px;flex-wrap:wrap}
.coderow input{flex:1 1 140px;font:600 24px 'Outfit',sans-serif;letter-spacing:8px;text-align:center;border:2.5px solid var(--ink);border-radius:14px;padding:10px;background:var(--bg);color:var(--ink);outline:none}
.proofcard .proof .meta{font-size:15px;opacity:.75;margin-bottom:6px}
.proofcard .rl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line);font-weight:500}
.proofcard .rl b{text-align:right;color:var(--ok)}
.gstat{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:19px}
.tbar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.tbar div{height:100%;width:100%;background:var(--yel1)}
.gimg{max-width:420px;margin:10px auto 0}
.gimg .fig{position:relative}
.gm{pointer-events:none;background:var(--bad);transform:translate(-50%,-50%) scale(1.25)}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media(max-width:560px){.gopts{grid-template-columns:1fr}}
.gopt{border:2.5px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:16px;padding:14px;font:600 17px 'Outfit',sans-serif;text-align:left;cursor:pointer}
.gopt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.gopt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.gopt:disabled{cursor:default}
</style>

const $ = (s, r = document) => r.querySelector(s);
const el = h => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const main = $('#main');

/* ---------- state ---------- */
const KEY = 'bohr-wuerfel-werkstatt-v1';
function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
let S = Object.assign({ name: '', klass: '', done: {}, res: {}, unlocked: false, best: 0 }, load()); S.done = S.done || {}; S.res = S.res || {};
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const allDone = () => [1, 2, 3, 4, 5].every(n => S.done[n]);

let toastT;
function toast(msg, kind) { const t = $('#toast'); t.textContent = msg; t.className = 'show ' + (kind || ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 2000); }
function shake(n) { n.classList.remove('shake'); void n.offsetWidth; n.classList.add('shake'); }
function counter(total, onAll) { let c = 0; return () => { if (++c === total) onAll(); }; }

/* ---------- Aquarell-Deko ---------- */
function wash(H, edgeY, seed, top) {
  let s = seed; const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const pts = []; for (let x = 0; x <= 400; x += 8) pts.push([x, edgeY + Math.sin(x / 37 + seed) * 7 + (r() - .5) * 15]);
  const edge = pts.slice().reverse().map(p => `L${p[0]} ${p[1].toFixed(1)}`).join(' ');
  const d = top ? `M0 0 L400 0 ${edge} Z` : `M0 ${H} L400 ${H} ${edge} Z`;
  const y0 = top ? 20 : H - 40;
  return `<svg viewBox="0 0 400 ${H}" preserveAspectRatio="none" width="100%" height="100%"><g filter="url(#blur)" opacity=".55"><ellipse cx="70" cy="${y0}" rx="90" ry="40" style="fill:var(--yel2)"/><ellipse cx="300" cy="${y0 + 20}" rx="110" ry="36" style="fill:var(--yel1)"/></g><g filter="url(#wc)"><path d="${d}" fill="url(#gWash)"/></g></svg>`;
}

/* ---------- Drag & Drop (Maus + Touch) ---------- */
const Drag = (() => {
  let picked = null, ghost = null, ty = 0, timer = null;
  const clearPick = () => { if (picked) picked.classList.remove('picked'); picked = null; };
  const zoneAt = (x, y) => { for (const e of document.elementsFromPoint(x, y)) { const z = e.closest && e.closest('.dz'); if (z && !z.classList.contains('full')) return z; } return null; };
  function item(node) {
    node.classList.add('dg'); node._home = node.parentElement;
    node.addEventListener('pointerdown', e => {
      if (node.classList.contains('locked') || (e.pointerType === 'mouse' && e.button !== 0)) return;
      const sx = e.clientX, sy = e.clientY, r = node.getBoundingClientRect(), ox = sx - r.left, oy = sy - r.top;
      let moved = false, hover = null;
      const mv = ev => {
        ty = ev.clientY;
        if (!moved) { if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 7) return; moved = true; clearPick();
          ghost = node.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width = r.width + 'px'; document.body.append(ghost); node.classList.add('lifted');
          timer = setInterval(() => { if (ty < 100) scrollBy(0, -14); else if (ty > innerHeight - 100) scrollBy(0, 14); }, 16); }
        ghost.style.left = (ev.clientX - ox) + 'px'; ghost.style.top = (ev.clientY - oy) + 'px';
        const z = zoneAt(ev.clientX, ev.clientY); if (z !== hover) { hover && hover.classList.remove('hover'); hover = z; hover && hover.classList.add('hover'); }
      };
      const up = ev => {
        removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
        clearInterval(timer);
        if (moved) {
          ghost && ghost.remove(); ghost = null; node.classList.remove('lifted'); hover && hover.classList.remove('hover');
          if (ev.type === 'pointerup') { const z = zoneAt(ev.clientX, ev.clientY); if (z) z.dispatchEvent(new CustomEvent('dropitem', { detail: node })); }
        } else if (ev.type === 'pointerup') { if (picked === node) clearPick(); else { clearPick(); picked = node; node.classList.add('picked'); } }
      };
      addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('pointercancel', up);
    });
    return node;
  }
  function zone(node, fn) {
    node.classList.add('dz');
    node.addEventListener('dropitem', e => fn(e.detail));
    node.addEventListener('click', e => { if (e.target.closest && e.target.closest('.dg')) return; if (picked) { const it = picked; clearPick(); fn(it); } });
    return node;
  }
  return { item, zone, clearPick };
})();
const lock = n => { n.classList.add('locked'); n.classList.remove('picked', 'lifted'); };
function deny(node, msg) { shake(node); toast(msg || 'Das passt nicht – versuch es nochmal.', 'bad'); }

/* ---------- Aufgabe 1: Mitte finden ---------- */
function z1() {
  main.append(intro(1, 'Mitte finden', ['Finde den Mittelpunkt einer Würfelfläche mit den Diagonalen!', 'Miss danach die Mitte einer Leiste aus!', 'Beantworte zwei Fragen zum Anreißen!']));
  const host = el('<div></div>'); let devB = 0;
  const tick = counter(4, () => { confetti(); finish(1, `Mitte gefunden · Abweichung ${devB.toFixed(1).replace('.', ',')} mm`, host); });

  // A: Diagonalen
  const A = el('<div class="card"></div>'); A.append(sec('A', 'Mit den Diagonalen', 'Tippe zwei gegenüberliegende Ecken nacheinander an – das ist eine Diagonale. Dann die zweite. Danach tippst du auf den Mittelpunkt.'));
  const svg = el(`<svg class="face" viewBox="-12 -12 124 124" role="img" aria-label="Würfelfläche"><rect x="0" y="0" width="100" height="100" fill="#E8C084" stroke="var(--head)" stroke-width="1.2"/><g opacity=".4">${[10, 22, 34, 46, 58, 70, 82, 94].map(y => `<path d="M0 ${y} C30 ${y - 3} 70 ${y + 3} 100 ${y}" stroke="#B97E3E" stroke-width=".6" fill="none"/>`).join('')}</g><g class="dl"></g><g class="cs"></g></svg>`);
  const C = { TL: [0, 0], TR: [100, 0], BR: [100, 100], BL: [0, 100] }, OPP = { TL: 'BR', BR: 'TL', TR: 'BL', BL: 'TR' };
  Object.entries(C).forEach(([k, [x, y]]) => $('.cs', svg).insertAdjacentHTML('beforeend', `<circle data-k="${k}" cx="${x}" cy="${y}" r="5" fill="var(--yel1)" stroke="var(--head)" stroke-width="1"/>`));
  const note = el('<div class="read">Tippe eine Ecke an.</div>');
  const dg = new Set(); let first = null, aDone = false;
  const dots = () => svg.querySelectorAll('.cs circle').forEach(c => c.setAttribute('fill', c.dataset.k === first ? '#3F8F5E' : 'var(--yel1)'));
  svg.addEventListener('pointerdown', e => {
    if (aDone) return; const p = svgPt(svg, e);
    if (dg.size < 2) {
      const k = Object.keys(C).find(k => Math.hypot(C[k][0] - p.x, C[k][1] - p.y) < 18);
      if (!k) { toast('Tippe auf eine Ecke!', 'bad'); return; }
      if (!first) { first = k; dots(); note.textContent = 'Jetzt die gegenüberliegende Ecke!'; }
      else if (k === first) { first = null; dots(); note.textContent = 'Tippe eine Ecke an.'; }
      else if (OPP[first] === k) {
        const key = [first, k].sort().join();
        if ([...dg].includes(key)) { toast('Diese Diagonale hast du schon.', 'bad'); first = null; dots(); return; }
        dg.add(key); $('.dl', svg).insertAdjacentHTML('beforeend', `<line x1="${C[first][0]}" y1="${C[first][1]}" x2="${C[k][0]}" y2="${C[k][1]}" stroke="#3a3a3a" stroke-width=".8"/>`);
        first = null; dots(); toast('Diagonale gezeichnet!', 'ok');
        note.innerHTML = dg.size === 1 ? 'Gut! Jetzt die <b>zweite</b> Diagonale.' : 'Wo liegt jetzt der <b>Mittelpunkt</b>? Tippe darauf!';
      } else { toast('Das sind benachbarte Ecken – nimm gegenüberliegende!', 'bad'); first = null; dots(); }
    } else {
      if (Math.hypot(p.x - 50, p.y - 50) <= 8) { aDone = true; $('.dl', svg).insertAdjacentHTML('beforeend', `<g stroke-linecap="round"><path d="M44 50H56M50 44V56" stroke="var(--ok)" stroke-width="1.6"/></g>`); note.innerHTML = '<span class="okmsg">✓ Genau – die Diagonalen kreuzen sich in der Mitte!</span>'; toast('Mittelpunkt gefunden!', 'ok'); tick(); }
      else { toast('Der Mittelpunkt liegt dort, wo sich die Diagonalen kreuzen.', 'bad'); shake(svg); }
    }
  });
  A.append(svg, note); main.append(A);

  // B: Maße
  const B = el('<div class="card"></div>'); B.append(sec('B', 'Mit Maßen', 'Das Holzstück ist <b>50 mm lang</b> und <b>30 mm breit</b>. Setze das Kreuz für eine mittige Bohrung (Toleranz 1,5 mm).'));
  const W = 50, H = 30; let g = '';
  for (let x = 0; x <= W; x += 5) g += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#000" stroke-opacity=".12" stroke-width=".12"/><line x1="${x}" y1="0" x2="${x}" y2="-1.6" stroke="var(--head)" stroke-width=".3"/>${x % 10 === 0 ? `<text x="${x}" y="-2.4" font-size="2.6" text-anchor="middle" fill="var(--head)" font-weight="700">${x}</text>` : ''}`;
  for (let y = 0; y <= H; y += 5) g += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#000" stroke-opacity=".12" stroke-width=".12"/><line x1="0" y1="${y}" x2="-1.6" y2="${y}" stroke="var(--head)" stroke-width=".3"/>${y % 10 === 0 ? `<text x="-2.4" y="${y + .9}" font-size="2.6" text-anchor="end" fill="var(--head)" font-weight="700">${y}</text>` : ''}`;
  const bs = el(`<svg class="board" viewBox="-8 -7 ${W + 12} ${H + 11}" role="img" aria-label="Holzleiste"><rect x="0" y="0" width="${W}" height="${H}" rx=".8" fill="#D9A15C" stroke="var(--head)" stroke-width=".4"/>${g}<g class="cx"></g></svg>`);
  const read = el('<div class="read">Tippe auf das Holzstück, um das Kreuz zu setzen.</div>');
  const bar = el('<div style="margin-top:10px"><button class="btn" disabled>Prüfen</button></div>'); const chk = $('.btn', bar); let placed = null, bDone = false;
  bs.addEventListener('pointerdown', e => {
    if (bDone) return; const p = svgPt(bs, e); const x = Math.max(0, Math.min(W, p.x)), y = Math.max(0, Math.min(H, p.y)); placed = { x, y };
    $('.cx', bs).innerHTML = `<path d="M${x - 2} ${y}H${x + 2}M${x} ${y - 2}V${y + 2}" stroke="#3a3a3a" stroke-width=".35" stroke-linecap="round"/>`;
    read.innerHTML = `Dein Kreuz: <b>${x.toFixed(1).replace('.', ',')} mm</b> von links · <b>${y.toFixed(1).replace('.', ',')} mm</b> von oben`; chk.disabled = false;
  });
  chk.onclick = () => {
    const dev = Math.hypot(placed.x - W / 2, placed.y - H / 2);
    if (dev <= 1.5) { bDone = true; devB = dev; chk.disabled = true; read.innerHTML = `<span class="okmsg">✓ Mittig! Abweichung nur ${dev.toFixed(1).replace('.', ',')} mm.</span>`; toast('Genau gemessen!', 'ok'); tick(); }
    else { read.innerHTML = `<span style="color:var(--bad);font-weight:700">Abweichung ${dev.toFixed(1).replace('.', ',')} mm – das ist nicht die Mitte. Halbiere Länge und Breite!</span>`; shake(bs); }
  };
  B.append(bs, read, bar); main.append(B);

  const Q = el('<div class="card"></div>'); Q.append(sec('C', 'Wissen zum Anreißen'));

  main.append(Q, host);
}

function z2() {

  const host = el('<div></div>'); const tick = counter(3, () => { confetti(); finish(2, '12/12 Kanten gebrochen', host); });
  const V = { FTL: [50, 110], FTR: [160, 110], FBR: [160, 220], FBL: [50, 220], BTL: [130, 40], BTR: [240, 40], BBR: [240, 150], BBL: [130, 150] };
  const vis = [['FTL', 'FTR'], ['FTR', 'FBR'], ['FBR', 'FBL'], ['FBL', 'FTL'], ['BTL', 'BTR'], ['BTR', 'BBR'], ['FTL', 'BTL'], ['FTR', 'BTR'], ['FBR', 'BBR']];
  const hid = [['BBR', 'BBL'], ['BBL', 'BTL'], ['FBL', 'BBL']];
  const pl = ks => ks.map(k => V[k].join(',')).join(' ');
  const edge = (e, h) => { const a = V[e[0]], b = V[e[1]]; return `<g class="edge${h ? ' hid' : ''}"><line class="vis" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/><line class="hit" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/></g>`; };
  const svg = el(`<svg class="iso" viewBox="0 0 290 250" role="img" aria-label="Würfel mit zwölf Kanten">

    <polygon points="${pl(['FTR', 'BTR', 'BBR', 'FBR'])}" fill="#CFA060"/>
    <polygon points="${pl(['FTL', 'FTR', 'FBR', 'FBL'])}" fill="#DDB074"/>
    ${vis.map(e => edge(e, false)).join('')}${hid.map(e => edge(e, true)).join('')}
  </svg>`);
  let n = 0, done = false;
  const card = el('<div class="card"></div>'); card.append(sec('A', 'Alle Kanten finden', 'Tippe jede Kante an. Sie wird gelb – gebrochen!'));
  const cnt = el('<div class="read counter"></div>'); const upd = () => { cnt.innerHTML = `Kanten gebrochen: <b>${n} / 12</b>`; }; upd();
  svg.querySelectorAll('.edge').forEach(g => g.addEventListener('pointerdown', e => {
    e.preventDefault(); const on = g.classList.toggle('broken'); n += on ? 1 : -1; upd();
    if (n === 12 && !done) { done = true; toast('Alle 12 Kanten gefunden!', 'ok'); tick(); }
    else if (!done && on && n === 9 && svg.querySelectorAll('.edge.hid:not(.broken)').length) toast('Denk an die Rückseite: gestrichelte Kanten!', '');
  }));
  card.append(svg, cnt); main.append(card);
  const Q = el('<div class="card"></div>'); Q.append(sec('B', 'Kurz nachgedacht'));
  Q.append(mcq('Wie viele Kanten hat ein Würfel?', ['6', '8', '12'], '12', tick));
  Q.append(mcq('Warum bricht man die Kanten?', ['Scharfe Kanten verletzen und splittern leicht', 'Damit der Würfel schwerer wird', 'Damit die Bohrung größer wird'], 'Scharfe Kanten verletzen und splittern leicht', tick));
  main.append(Q, host);
}

/* ---------- Aufgabe 3: Qualitätskontrolle ---------- */
function cubeSvg(kind, hx, hy, r) {
  let g = ''; for (let i = 0; i < 9; i++) g += `<path d="M8 ${16 + i * 11} C40 ${12 + i * 11} 80 ${20 + i * 11} 112 ${16 + i * 11}" stroke="#B97E3E" stroke-opacity=".45" stroke-width=".7" fill="none"/>`;
  const sharp = kind === 'sharp';
  let s = `<rect x="6" y="6" width="108" height="108" rx="${sharp ? 0 : 8}" fill="#E8C084" stroke="#5a3a1c" stroke-width="${sharp ? 2.6 : 1.4}"/>${g}`;
  if (!sharp) s += `<rect x="13" y="13" width="94" height="94" rx="4" fill="none" stroke="#F8E2B5" stroke-width="2.6"/><path d="M6 6L13 13M114 6L107 13M6 114L13 107M114 114L107 107" stroke="#F8E2B5" stroke-width="2.4"/>`;
  else s += `<path d="M6 6l9 2-7 5zM114 6l-9 2 7 5zM6 114l9-2-7-5zM114 114l-9-2 7-5z" fill="#4a2c12"/><path d="M30 6l2-4 3 4M80 114l2 4 3-4M6 70l-4 2 4 3M114 40l4 2-4 3" stroke="#4a2c12" stroke-width="1.4" fill="none"/>`;
  if (kind === 'rough') { let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }; for (let i = 0; i < 26; i++) { const x = 12 + rnd() * 96, y = 12 + rnd() * 96, a = rnd() * 3.14, l = 8 + rnd() * 16; s += `<path d="M${x.toFixed(1)} ${y.toFixed(1)}l${(Math.cos(a) * l).toFixed(1)} ${(Math.sin(a) * l).toFixed(1)}" stroke="#4a2c12" stroke-opacity=".6" stroke-width=".9" fill="none"/>`; } for (let i = 0; i < 40; i++) s += `<circle cx="${(12 + rnd() * 96).toFixed(1)}" cy="${(12 + rnd() * 96).toFixed(1)}" r="${(.6 + rnd() * .9).toFixed(1)}" fill="#6b4220" opacity=".55"/>`; }
  s += `<circle cx="${hx}" cy="${hy}" r="${r}" fill="#3a2410" stroke="#2a1808" stroke-width="1.2"/><circle cx="${hx}" cy="${hy}" r="${r - 3}" fill="#1f1208"/>`;
  return `<svg viewBox="0 0 120 120" role="img" aria-label="Würfel zur Prüfung">${s}</svg>`;
}
function z3() {
  main.append(intro(3, 'Qualitätskontrolle', ['Du bist Prüfer: Sind die Würfel in Ordnung?', 'Prüfe Bohrung, Kanten und Oberfläche.', 'Wähle zu jedem Würfel das richtige Urteil!']));
  const host = el('<div></div>'); const tick = counter(8, () => { confetti(); finish(3, '6 Würfel richtig geprüft', host); });
  main.append(el(`<div class="card"><div class="sec">Das prüfst du</div><ul class="crit"><li><b>Bohrung:</b> genau in der Mitte der Fläche</li><li><b>Kanten:</b> alle gebrochen – du erkennst eine helle, abgeschrägte Kante</li><li><b>Oberfläche:</b> glatt, ohne Kratzer und raue Stellen</li></ul></div>`));
  const L = ['In Ordnung ✓', 'Bohrung nicht mittig', 'Kanten nicht gebrochen', 'Oberfläche nicht glatt'];
  const C = [['ok', 60, 60, 14, L[0]], ['off', 42, 76, 14, L[1]], ['sharp', 60, 60, 14, L[2]], ['rough', 60, 60, 14, L[3]], ['off', 80, 44, 12, L[1]], ['ok', 60, 60, 11, L[0]]];
  const card = el('<div class="card"></div>'); card.append(sec('A', 'Würfel prüfen', 'Tippe zu jedem Würfel das passende Urteil an.'));
  const grid = el('<div class="qcgrid"></div>');
  C.forEach(([k, x, y, r, a], i) => {
    const c = el(`<div class="qc"><div class="imgbox">${cubeSvg(k, x, y, r)}</div><div class="qn">Würfel ${'ABCDEF'[i]}</div><div class="chips"></div></div>`);
    shuffle(L).forEach(o => {
      const b = el(`<button class="chip">${o}</button>`);
      b.onclick = () => { if (o === a) { c.classList.add('solved', 'pop'); $('.chips', c).innerHTML = `<span class="okmsg">✓ ${o}</span>`; toast('Richtig geprüft!', 'ok'); tick(); } else { b.classList.add('bad'); shake(c); toast('Schau nochmal genau hin!', 'bad'); } };
      $('.chips', c).append(b);
    });
    grid.append(c);
  });
  card.append(grid); main.append(card);
  const Q = el('<div class="card"></div>'); Q.append(sec('B', 'Wie prüfst du richtig?'));
  Q.append(mcq('Wie prüfst du, ob die Bohrung mittig ist?', ['Ich messe von allen Kanten bis zum Rand der Bohrung – überall gleich weit', 'Ich schaue nur ungefähr hin', 'Ich zähle die Fasern im Holz'], 'Ich messe von allen Kanten bis zum Rand der Bohrung – überall gleich weit', tick));
  Q.append(mcq('Wie prüfst du die Kanten und die Oberfläche?', ['Ich fahre vorsichtig mit dem Finger darüber – nichts darf scharf oder splittrig sein', 'Ich klopfe auf den Würfel', 'Ich werfe den Würfel auf den Tisch'], 'Ich fahre vorsichtig mit dem Finger darüber – nichts darf scharf oder splittrig sein', tick));
  main.append(Q, host);
}

/* ---------- Aufgabe 4: Beobachter am Bohrplatz ---------- */
function z4() {
  main.append(intro(4, 'Beobachter am Bohrplatz', ['Beobachte einen Mitschüler beim Bohren.', 'Tippe bei jedem Schritt: gemacht ✓ oder vergessen ✗.', 'Gib ihm danach eine Rückmeldung.']));
  main.append(el(`<div class="warn"><span class="wi">⚠️</span><div><b>Unbedingt Sicherheitsabstand halten!</b><br>Geh beim Beobachten nie näher an die Bohrmaschine, als deine Lehrkraft erlaubt. Fasse nichts an und lenke den Bohrenden nicht ab.</div></div>`));
  const host = el('<div></div>');
  const ST = ['Anreißen', 'Vorstechen', 'Bohrer einspannen', 'Werkstück einspannen', 'Bohrtisch einstellen', 'Werkstück ausrichten', 'Schutzbrille aufsetzen', 'Bohren', 'Werkstück ausspannen', 'Bohrer ausspannen', 'Schutzbrille aufräumen'];
  const card = el('<div class="card"></div>'); card.append(sec('A', 'Beobachtungsbogen'));
  const safe = el('<label class="safe"><input type="checkbox"> <span>Ich halte <b>unbedingt Sicherheitsabstand</b> zur Bohrmaschine.</span></label>');
  card.append(safe, el('<div class="who" style="grid-template-columns:1fr;margin:12px 0 4px"><div><label for="ob">Wen beobachtest du?</label><input id="ob" autocomplete="off" placeholder="Name"></div></div>'));
  const ok = () => $('input', safe).checked;
  const val = ST.map(() => 0), rows = [];
  const sum = el('<div class="msg"></div>'); const fin = el('<button class="btn" style="margin-top:14px" disabled>Auswerten</button>');
  ST.forEach((s, i) => {
    const r = el(`<div class="obs"><span class="n">${i + 1}</span><span class="t">${s}</span><span class="bt"><button class="yes" aria-label="gemacht">✓</button><button class="no" aria-label="vergessen">✗</button></span></div>`);
    const [y, no] = r.querySelectorAll('button');
    const guard = f => () => { if (!ok()) { shake(safe); toast('Hake erst den Sicherheitsabstand ab!', 'bad'); return; } f(); paint(); };
    y.onclick = guard(() => { val[i] = val[i] === 1 ? 0 : 1; }); no.onclick = guard(() => { val[i] = val[i] === -1 ? 0 : -1; });
    rows.push([r, y, no]); card.append(r);
  });
  function paint() { rows.forEach(([r, y, n], i) => { y.classList.toggle('on', val[i] === 1); n.classList.toggle('on', val[i] === -1); r.classList.toggle('okr', val[i] === 1); r.classList.toggle('nor', val[i] === -1); }); fin.disabled = val.some(v => v === 0) || !ok(); sum.textContent = `${val.filter(v => v !== 0).length} von ${ST.length} Schritten bewertet`; }
  $('input', safe).onchange = paint; paint();
  card.append(sum, el('<div class="tipps" style="margin-top:12px"><b>Tipps der Checkliste:</b><br>• genau anzeichnen!<br>• Werkstück schützen (Abfallholz verwenden)</div>'), fin);
  main.append(card, host);
  fin.onclick = () => {
    fin.disabled = true; const bad = ST.filter((_, i) => val[i] === -1), good = val.filter(v => v === 1).length;
    const fb = el('<div class="card"></div>'); fb.append(sec('B', 'Deine Rückmeldung'));
    fb.append(el(`<p style="margin:6px 0;font-weight:600">${bad.length ? 'Das ist beim nächsten Mal noch zu verbessern:' : 'Alle 11 Schritte hat dein Mitschüler richtig gemacht!'}</p>`));
    if (bad.length) fb.append(el(`<ul class="review">${bad.map(b => `<li><b>${b}</b> – bitte nicht vergessen!</li>`).join('')}</ul>`));
    fb.append(el('<p class="hint" style="margin-top:10px">Sag es freundlich: Erst, was gut war – dann, was besser geht.</p>'));
    main.insertBefore(fb, host); confetti(); finish(4, `${good} von ${ST.length} Schritten ✓ beobachtet`, host);
  };
}

/* ---------- Endergebnis & Freischaltung ---------- */
const allFour = () => [1, 2, 3, 4].every(n => S.done[n]);
const fnv = s => { let x = 2166136261; for (const c of s) { x ^= c.charCodeAt(0); x = Math.imul(x, 16777619) >>> 0; } return x; };
const CODE_H = 4259139161;
function endPage() {
  main.append(el(`<section class="intro"><div class="intro-l"><span class="badge">Praxiswoche</span><h2 class="brush">Endergebnis</h2><ul class="tasks"><li>Zeig diese Seite deiner Lehrkraft.</li><li>Sie gibt dir mit einem Code das Trainingsspiel frei.</li></ul></div><div class="intro-r"><img alt="" src="${IMG.bulb}"></div></section>`));
  const date = new Date().toLocaleDateString('de-DE');
  const T = ['Mitte finden', 'Kanten brechen', 'Qualitätskontrolle', 'Beobachter am Bohrplatz'];
  const c = el(`<div class="card finish proofcard"><div class="brush">Mein Endergebnis</div><div class="proof"><input class="fin-name" placeholder="Dein Name" aria-label="Name"><div class="meta">${date}</div>${T.map((t, i) => `<div class="rl"><span>${i + 1}. ${t}</span><b>${S.res[i + 1] || '–'}</b></div>`).join('')}</div><div><b>Zeig dieses Endergebnis deiner Lehrkraft!</b></div></div>`);
  const inp = $('.fin-name', c); inp.value = S.name + (S.klass ? ' · ' + S.klass : ''); inp.oninput = () => { S.name = inp.value; save(); };
  main.append(c);
  const u = el('<div class="card"></div>');
  if (S.unlocked) {
    u.append(sec('🎮', 'Bohrführerschein-Trainingsspiel', 'Freigeschaltet! Teste dein Wissen von den Bohrstationen.'), el('<button class="btn">Spiel starten</button>'));
    $('button', u).onclick = () => go('game');
  } else {
    u.append(sec('🔒', 'Trainingsspiel freischalten', 'Den Code gibt dir deine Lehrkraft, wenn sie dein Endergebnis gesehen hat.'));
    const row = el('<div class="coderow"><input id="code" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="Code" aria-label="Code"><button class="btn">Freischalten</button></div>');
    const go_ = () => { const v = $('#code', row).value.trim(); if (fnv('bf:' + v) === CODE_H) { S.unlocked = true; save(); toast('Freigeschaltet!', 'ok'); confetti(); render(); } else { shake(row); toast('Falscher Code.', 'bad'); $('#code', row).value = ''; } };
    $('button', row).onclick = go_; $('#code', row).onkeydown = e => { if (e.key === 'Enter') go_(); };
    u.append(row);
  }
  main.append(u);
}

/* ---------- Trainingsspiel ---------- */
let gameTimer = null;
function game() {
  if (!S.unlocked) { go('end'); return; }
  main.append(el(`<section class="intro"><div class="intro-l"><span class="badge">Bohrführerschein-Training</span><h2 class="brush">Trainingsspiel</h2><ul class="tasks"><li>15 Fragen zu den Bohrstationen – du hast 3 Leben ❤️</li><li>Pro Frage 15 Sekunden Zeit</li><li>Mehrere richtige Antworten hintereinander geben Bonuspunkte!</li></ul></div><div class="intro-r"><img alt="" src="${IMG.bulb}"></div></section>`));
  const box = el('<div class="card"></div>'); main.append(box);
  const P = [
    ['Ein-/Aus-Schalter', 'Startet und beendet den Bohrvorgang.', 18.8, 22.4], ['Bohrfutter', 'Im Bohrfutter wird der Bohrer eingespannt.', 20, 38.5], ['Bohrer', 'Dringt in das zu bohrende Material ein.', 35, 47.5],
    ['Elektromotor', 'Treibt die Bohrmaschine an.', 81.8, 18], ['Tiefenanschlag', 'Hiermit kann man die Tiefe der Bohrung einstellen.', 54, 30.2], ['Vorschubhebel', 'Hiermit drückt man den Bohrer nach unten.', 50, 44],
    ['Arbeitstisch', 'Ist mit Hilfe einer Kurbel höhenverstellbar.', 30, 58], ['Fuß', 'Darauf steht die ganze Maschine.', 45, 90], ['Maschinenschraubstock', 'Hier wird das zu bohrende Teil eingespannt.', 50, 45, 1]];
  const PN = P.map(p => p[0]);
  const B = [['holz', 'Holzbohrer'], ['metall', 'Metallbohrer'], ['forstner', 'Forstnerbohrer'], ['senker', 'Senkbohrer']];
  const ST = ['Anreißen', 'Vorstechen', 'Bohrer einspannen', 'Werkstück einspannen', 'Bohrtisch einstellen', 'Werkstück ausrichten', 'Schutzbrille aufsetzen', 'Bohren', 'Werkstück ausspannen', 'Bohrer ausspannen', 'Schutzbrille aufräumen'];
  const cats = { Bohrer: [], Teile: [], Anreißen: [], Sicherheit: [], Schritte: [] };
  B.forEach(([k, n]) => cats.Bohrer.push({ q: 'Welcher Bohrer ist das?', img: IMG[k], a: n, pool: B.map(b => b[1]) }));
  P.forEach((p, i) => { cats.Teile.push({ q: 'Wie heißt das markierte Teil?', mark: p, a: p[0], pool: PN }); cats.Teile.push({ q: `Welches Teil ist das? „${p[1]}“`, a: p[0], pool: PN }); });
  [['Womit reißt du Holz an?', 'Bleistift', ['Bleistift', 'Folienstift', 'Reißnadel']], ['Womit reißt du Kunststoff an?', 'Folienstift', ['Bleistift', 'Folienstift', 'Reißnadel']], ['Womit reißt du Metall an?', 'Reißnadel', ['Bleistift', 'Folienstift', 'Reißnadel']],
   ['Womit stichst du bei Holz vor?', 'Vorstecher', ['Vorstecher', 'Körner']], ['Womit stichst du bei Metall vor?', 'Körner', ['Vorstecher', 'Körner']], ['Wie markiert man eine Bohrung?', 'Mit einem dünnen Kreuz', ['Mit einem dünnen Kreuz', 'Mit einem dicken Kringel', 'Mit einem Kreis', 'Mit einem Osterei']]]
    .forEach(([q, a, pool]) => cats.Anreißen.push({ q, a, pool }));
  [['Warum arbeitet immer nur ein Schüler an der Bohrmaschine?', 'Sonst leidet die Konzentration', ['Sonst leidet die Konzentration', 'Sonst wird der Motor heiß', 'Sonst wird der Bohrer stumpf']], ['Warum legt man Ketten, Ohrringe und Schals ab?', 'Sie könnten sich in der Maschine verfangen', ['Sie könnten sich in der Maschine verfangen', 'Sie könnten rosten', 'Sie stören beim Anreißen']],
   ['Warum spannt man das Werkstück fest?', 'Sonst dreht es sich mit und wird zum Wurfgeschoss', ['Sonst dreht es sich mit und wird zum Wurfgeschoss', 'Sonst wird der Bohrer stumpf', 'Sonst wird das Loch zu klein']], ['Warum trägt man immer eine Schutzbrille?', 'Späne könnten ins Auge gelangen', ['Späne könnten ins Auge gelangen', 'Der Motor ist sehr hell', 'Die Brille hält das Werkstück']],
   ['Wie verhältst du dich, wenn du nur zuschaust?', 'Ich halte Sicherheitsabstand', ['Ich halte Sicherheitsabstand', 'Ich stehe direkt neben dem Bohrenden', 'Ich halte das Werkstück fest']]]
    .forEach(([q, a, pool]) => cats.Sicherheit.push({ q, a, pool }));
  for (let i = 0; i < ST.length - 1; i++) cats.Schritte.push({ q: `Was kommt direkt nach „${ST[i]}“?`, a: ST[i + 1], pool: ST.filter(s => s !== ST[i]) });
  function pick15() { const l = Object.values(cats).map(a => shuffle(a)); const out = []; let k = 0; while (out.length < 15) { const a = l[k % l.length]; if (a.length) out.push(a.shift()); k++; if (k > 200) break; } return shuffle(out); }
  function start() {
    const qs = pick15(); let i = 0, lives = 3, score = 0, streak = 0, right = 0;
    const head = () => `<div class="gstat"><span>Frage ${Math.min(i + 1, qs.length)} / ${qs.length}</span><span>${'❤️'.repeat(lives)}${'🖤'.repeat(3 - lives)}</span><span>⭐ ${score}</span></div>`;
    function show() {
      clearInterval(gameTimer);
      if (i >= qs.length || lives <= 0) return end();
      const Q = qs[i]; let over = false, left = 15;
      const opts = shuffle([Q.a, ...shuffle(Q.pool.filter(x => x !== Q.a)).slice(0, 3)]);
      box.innerHTML = head() + '<div class="tbar"><div></div></div>';
      box.append(el(`<div class="q" style="font-size:21px;margin-top:10px">${Q.q}</div>`));
      if (Q.img) box.append(el(`<div class="gimg"><div class="imgbox"><img alt="" src="${Q.img}"></div></div>`));
      if (Q.mark) { const m = Q.mark; box.append(el(`<div class="gimg"><div class="fig"><div class="imgbox"><img alt="" src="${m[4] ? IMG.vise : IMG.press}"></div><span class="mk gm" style="left:${m[2]}%;top:${m[3]}%">?</span></div></div>`)); }
      const g = el('<div class="gopts"></div>'); const fb = el('<div class="msg"></div>');
      const bar = $('.tbar div', box);
      const answer = (o, btn) => {
        if (over) return; over = true; clearInterval(gameTimer);
        [...g.children].forEach(b => { b.disabled = true; if (b.textContent === Q.a) b.classList.add('right'); });
        if (o === Q.a) { streak++; right++; const pts = 100 + left * 5 + (streak - 1) * 10; score += pts; fb.style.color = 'var(--ok)'; fb.textContent = `Richtig! +${pts}${streak > 1 ? ' · ' + streak + ' in Folge' : ''}`; }
        else { streak = 0; lives--; if (btn) btn.classList.add('wrong'); fb.style.color = 'var(--bad)'; fb.textContent = o === null ? 'Zeit abgelaufen! −1 Leben' : 'Leider falsch. −1 Leben'; shake(g); }
        setTimeout(() => { i++; show(); }, 1300);
      };
      opts.forEach(o => { const b = el(`<button class="gopt">${o}</button>`); b.onclick = () => answer(o, b); g.append(b); });
      box.append(g, fb);
      const t0 = Date.now();
      gameTimer = setInterval(() => { const e = (Date.now() - t0) / 1000; left = Math.max(0, Math.ceil(15 - e)); bar.style.width = Math.max(0, 100 - e / 15 * 100) + '%'; if (e >= 15) answer(null, null); }, 100);
    }
    function end() {
      clearInterval(gameTimer);
      const rank = right >= 13 ? ['Bohrmeister', '🏆'] : right >= 9 ? ['Geselle', '🥈'] : ['Lehrling', '🔧'];
      if (!S.best || score > S.best) { S.best = score; save(); }
      box.innerHTML = `<div class="score" style="text-align:center">${score} Punkte</div><div class="sec" style="justify-content:center;margin-top:6px">${rank[1]} ${rank[0]}</div><p style="text-align:center;font-weight:600;margin:0">${right} von ${Math.min(i, qs.length)} Fragen richtig${lives <= 0 ? ' – deine Leben sind aufgebraucht.' : '.'}<br>Dein Rekord: ${S.best} Punkte</p>`;
      const b = el('<div style="text-align:center;margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn">Nochmal spielen</button><button class="btn alt">Zurück</button></div>');
      const [a, c] = b.querySelectorAll('button'); a.onclick = start; c.onclick = () => go('hub'); box.append(b); if (right >= 13) confetti();
    }
    show();
  }
  box.append(sec('🎮', 'Bist du bereit?', 'Alle Fragen kommen aus den Bohrstationen der letzten Woche.'), el('<button class="btn">Spiel starten</button>'));
  $('button', box).onclick = start;
}
render();
